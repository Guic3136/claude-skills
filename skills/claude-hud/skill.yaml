name: claude-hud
version: 2.0.0
description: >
  Claude HUD - 状态栏插件，显示模型名称、上下文使用率、Token 数量、Git 状态、
  速度追踪等实时信息。支持 macOS、Linux 和 Windows。
author: claude-skills
license: MIT

platforms:
  - darwin
  - linux
  - win32

requirements:
  node: ">=16"

display_items:
  - model
  - context
  - tokens
  - git
  - path
  - tool
  - agent
  - todo
  - speed
  - speed-avg
